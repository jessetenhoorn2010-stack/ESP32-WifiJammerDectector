<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scorebord">
<title>Oude mij vs Toekomstige mij</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #111827; --card: #1f2937; --line: #374151; --text: #f9fafb; --muted: #9ca3af;
    --old: #f87171; --future: #34d399; --accent: #60a5fa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 520px; margin-inline: auto;
  }
  h1 { font-size: 1.1rem; text-align: center; color: var(--muted); font-weight: 600; margin: 0 0 12px; letter-spacing: .05em; text-transform: uppercase; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; }

  .board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; }
  .side .label { font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  .side .score { font-size: 4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .old .score { color: var(--old); }
  .future .score { color: var(--future); }
  .dash { font-size: 3rem; color: var(--muted); padding: 0 8px; }
  .lead { text-align: center; margin-top: 10px; color: var(--muted); font-size: .9rem; }

  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .progress div { height: 100%; background: var(--future); width: 0; transition: width .2s; }
  .counts { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }

  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li label { flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 1.05rem; }
  li input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--future); flex: none; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  .del { background: none; border: 0; color: var(--old); font-size: 1.3rem; padding: 4px 8px; display: none; }
  body.editing .del { display: block; }
  .empty { color: var(--muted); text-align: center; padding: 12px 0; }

  .add { display: none; gap: 8px; margin-top: 12px; }
  body.editing .add { display: flex; }
  .add input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 1rem; }

  button.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #0b1220; width: 100%; }
  .btn.small { padding: 10px 14px; font-size: .9rem; background: var(--line); color: var(--text); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

  .history li { font-size: .9rem; justify-content: space-between; }
  .tag { font-weight: 700; padding: 2px 8px; border-radius: 99px; font-size: .8rem; }
  .tag.old { background: rgba(248,113,113,.15); color: var(--old); }
  .tag.future { background: rgba(52,211,153,.15); color: var(--future); }
  .tag.draw { background: var(--line); color: var(--muted); }
  .footer { display: flex; gap: 8px; justify-content: center; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(150%);
    background: var(--card); border: 1px solid var(--line); padding: 14px 18px; border-radius: 14px; font-weight: 700; transition: transform .25s; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>Oude mij vs Toekomstige mij</h1>

  <section class="card">
    <div class="board">
      <div class="side old"><div class="label">Oude mij</div><div class="score" id="scoreOld">0</div></div>
      <div class="dash">–</div>
      <div class="side future"><div class="label">Toekomstige mij</div><div class="score" id="scoreFuture">0</div></div>
    </div>
    <div class="lead" id="lead"></div>
  </section>

  <section class="card">
    <div class="row">
      <h2>Checklist van vandaag</h2>
      <button class="btn small" id="editBtn">Bewerken</button>
    </div>
    <div class="counts"><span id="doneCount">0 gedaan</span><span id="todoCount">0 niet gedaan</span></div>
    <div class="progress"><div id="bar"></div></div>
    <ul id="list"></ul>
    <form class="add" id="addForm">
      <input id="newItem" placeholder="Nieuwe taak…" autocomplete="off">
      <button class="btn small" type="submit">Toevoegen</button>
    </form>
  </section>

  <section class="card">
    <button class="btn primary" id="finishBtn">Dag afronden</button>
  </section>

  <section class="card">
    <h2>Geschiedenis</h2>
    <ul class="history" id="history"></ul>
  </section>

  <div class="footer">
    <button class="btn small" id="undoBtn">Laatste ongedaan maken</button>
    <button class="btn small" id="resetBtn">Score resetten</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ====== HIER KUN JE LATER JE EIGEN CHECKLIST ZETTEN ======
// (Je kunt taken ook gewoon in de app toevoegen/verwijderen via "Bewerken".)
const STANDAARD_TAKEN = [
  "Gym",
  "Niet roken",
  "Hhw",
  "Goonen",
  "Opstaan zonder snooze",
  "Voor 23:00 in bed",
  "Geen onnodige aankopen",
  "€2,50 sparen",
  "Aan mijn ESP32-project werken"
];
// ==========================================================

const KEY = "scorebord-oud-vs-toekomst";
const $ = id => document.getElementById(id);

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.items)) return s;
  } catch (e) {}
  return {
    old: 0, future: 0,
    items: STANDAARD_TAKEN.map(t => ({ text: t, done: false })),
    history: []
  };
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function render() {
  $("scoreOld").textContent = state.old;
  $("scoreFuture").textContent = state.future;
  $("lead").textContent =
    state.future > state.old ? "Toekomstige mij staat voor 💪" :
    state.old > state.future ? "Oude mij staat voor – tijd om terug te slaan!" :
    "Gelijkspel";

  const list = $("list");
  list.innerHTML = "";
  if (!state.items.length) list.innerHTML = '<li class="empty">Nog geen taken. Tik op “Bewerken” om ze toe te voegen.</li>';
  state.items.forEach((it, i) => {
    const li = document.createElement("li");
    if (it.done) li.className = "done";
    li.innerHTML = `<label><input type="checkbox" ${it.done ? "checked" : ""}><span></span></label><button class="del" aria-label="Verwijder">✕</button>`;
    li.querySelector("span").textContent = it.text;
    li.querySelector("input").onchange = e => { it.done = e.target.checked; save(); render(); };
    li.querySelector(".del").onclick = () => { state.items.splice(i, 1); save(); render(); };
    list.appendChild(li);
  });

  const done = state.items.filter(i => i.done).length;
  const total = state.items.length;
  $("doneCount").textContent = `${done} gedaan`;
  $("todoCount").textContent = `${total - done} niet gedaan`;
  $("bar").style.width = total ? (done / total * 100) + "%" : "0";

  const h = $("history");
  h.innerHTML = "";
  if (!state.history.length) h.innerHTML = '<li class="empty">Nog geen dagen afgerond.</li>';
  state.history.slice().reverse().slice(0, 30).forEach(r => {
    const li = document.createElement("li");
    const label = r.winner === "old" ? "Oude mij +1" : r.winner === "future" ? "Toekomstige mij +1" : "Gelijkspel";
    li.innerHTML = `<span>${r.date} · ${r.done}/${r.total}</span><span class="tag ${r.winner}">${label}</span>`;
    h.appendChild(li);
  });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2500);
}

// ---- Spelregels ----
// Alles gedaan                     -> Toekomstige mij +1
// Meer NIET gedaan dan wel gedaan  -> Oude mij +1
// Daartussenin                     -> gelijkspel (niemand een punt)
$("finishBtn").onclick = () => {
  const total = state.items.length;
  if (!total) return toast("Voeg eerst taken toe");
  const done = state.items.filter(i => i.done).length;
  const notDone = total - done;
  let winner = "draw";
  if (done === total) winner = "future";
  else if (notDone > done) winner = "old";

  if (!confirm(`Dag afronden met ${done} van de ${total} gedaan?`)) return;

  if (winner === "future") state.future++;
  if (winner === "old") state.old++;
  state.history.push({ date: new Date().toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" }), done, total, winner });
  state.items.forEach(i => i.done = false);
  save(); render();
  toast(winner === "future" ? "🎉 Punt voor Toekomstige mij!" : winner === "old" ? "Punt voor Oude mij…" : "Gelijkspel – niemand een punt");
};

$("undoBtn").onclick = () => {
  const r = state.history.pop();
  if (!r) return toast("Niets om ongedaan te maken");
  if (r.winner === "future") state.future--;
  if (r.winner === "old") state.old--;
  save(); render(); toast("Laatste dag ongedaan gemaakt");
};

$("resetBtn").onclick = () => {
  if (!confirm("Score en geschiedenis op 0 zetten? (Je checklist blijft staan)")) return;
  state.old = 0; state.future = 0; state.history = [];
  save(); render();
};

$("editBtn").onclick = () => {
  const on = document.body.classList.toggle("editing");
  $("editBtn").textContent = on ? "Klaar" : "Bewerken";
  if (on) $("newItem").focus();
};

$("addForm").onsubmit = e => {
  e.preventDefault();
  const v = $("newItem").value.trim();
  if (!v) return;
  state.items.push({ text: v, done: false });
  $("newItem").value = "";
  save(); render();
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
</body>
</html>
